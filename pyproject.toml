[project]
name = "tyr-predictor"
version = "0.1.0"
description = ""
authors = [
    {name = "Thomas Schleicher",email = "thschleicher@edu.aau.at"},
    {name = "Raphael Walcher",email = "rawalcher@edu.aau.at"},
    {name = "Jakob Stornig",email = "jastornig@edu.aau.at"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ty.environment]
python = ".venv"

[dependency-groups]
dev = [
    "nbstripout (>=0.9.1,<0.10.0)"
]

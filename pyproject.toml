[project]
name = "tyr-predictor"
version = "0.1.0"
description = "A win prediction AI & ML Lab for the Tank Shooter Tyr."
authors = [
    {name = "Thomas Schleicher",email = "thschleicher@edu.aau.at"},
    {name = "Raphael Walcher",email = "rawalcher@edu.aau.at"},
    {name = "Jakob Stornig",email = "jastornig@edu.aau.at"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pandas>=3.0.6,<4.0.0",
    "scikit-learn>=1.9.1,<2.0.0",
    "matplotlib>=3.11.2,<4.0.0",
    "ipykernel>=7.4.0,<8.0.0",
    "ipython>=9.17.1",
    "tabulate>=0.10.0",
    "fastparquet>=2026.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1,<0.10.0",
]

[tool.ty.environment]
python = ".venv"
